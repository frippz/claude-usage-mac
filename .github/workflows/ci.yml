name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only whatever the repository default, since pull requests from forks
# run here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: UsageCore
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # Proves the whole data path runs end to end on a machine with no Claude
      # Code install: no credentials and no ~/.claude/projects. Exit 1 with
      # "no-token" is the correct outcome here, so only a crash fails the step.
      - name: Smoke test the CLI
        run: |
          set -o pipefail
          swift run usage-cli --json | tee /tmp/snapshot.json || true
          python3 -c "import json;json.load(open('/tmp/snapshot.json'))"

  app:
    name: App + Widget
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # scripts/version.sh reads the tags

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      - name: Generate project
        run: xcodegen generate

      - name: Build app and widget
        run: |
          set -o pipefail
          xcodebuild build \
            -project Headroom.xcodeproj \
            -scheme Headroom \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO \
            $(scripts/version.sh) \
            | xcbeautify --renderer github-actions

      - name: Render snapshots
        run: |
          set -o pipefail
          xcodebuild test \
            -project Headroom.xcodeproj \
            -scheme SnapshotTests \
            -destination 'platform=macOS' \
            | xcbeautify --renderer github-actions

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: snapshots
          path: snapshots/
          if-no-files-found: error

      - name: Check the bundle
        run: |
          set -euo pipefail
          APP="dd/Build/Products/Release/Headroom.app"

          # Unsigned here (the team certificate lives on the dev Mac), so this
          # checks structure only; entitlements are checked locally.
          test -d "$APP/Contents/PlugIns/HeadroomWidget.appex" \
            || { echo "widget did not embed"; ls -R "$APP/Contents"; exit 1; }

          # A missing icon should fail the build, not ship as a blank square in
          # the widget gallery.
          test -f "$APP/Contents/Resources/Assets.car" \
            || { echo "asset catalog missing — no app icon"; exit 1; }
          assetutil --info "$APP/Contents/Resources/Assets.car" \
            | grep -q AppIcon || { echo "Assets.car has no AppIcon"; exit 1; }
