name: ClaudeUsage

options:
  bundleIdPrefix: se.frodlund
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # A stable team identity, not ad-hoc: the widget extension is identified by
    # its signature, so ad-hoc signing made every rebuild a new extension to
    # macOS. Manual style needs no provisioning profile, because the only
    # entitlements are the sandbox and a team-prefixed App Group. CI overrides
    # this with CODE_SIGNING_ALLOWED=NO.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: XU3G5KB593
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:

  ClaudeUsage:
    type: application
    platform: macOS
    sources:
      - Sources/UsageCore
      - Sources/SharedViews
      - Sources/MenuBarApp
      - Sources/MenuBarApp/Assets.xcassets
    dependencies:
      - target: ClaudeUsageWidget
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.frodlund.claude-usage
        PRODUCT_NAME: Claude Usage
        GENERATE_INFOPLIST_FILE: YES
        # No Dock icon, no menu bar — this app is only its status item. The icon
        # still shows in Finder, the DMG, login items, and the widget gallery.
        INFOPLIST_KEY_LSUIElement: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT"
        COMBINE_HIDPI_IMAGES: YES
    entitlements:
      path: Sources/MenuBarApp/ClaudeUsage.entitlements
      properties:
        # The host app is the one process that must read ~/.claude and the
        # Keychain, so it is deliberately not sandboxed.
        com.apple.security.app-sandbox: false
        com.apple.security.application-groups:
          - XU3G5KB593.se.frodlund.claude-usage

  ClaudeUsageWidget:
    type: app-extension
    platform: macOS
    sources:
      - Sources/UsageCore
      - Sources/SharedViews
      - Sources/Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.frodlund.claude-usage.widget
        PRODUCT_NAME: ClaudeUsageWidget
    info:
      path: Sources/Widget/Info.plist
      properties:
        CFBundleDisplayName: Claude Usage
        # Must match the containing app or the bundle fails validation.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Sources/Widget/ClaudeUsageWidget.entitlements
      properties:
        # Required, not optional: macOS never registers an unsandboxed app
        # extension, so the widget simply never appears in the gallery. It reads
        # what the host writes to the shared App Group — see SnapshotBundle.
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - XU3G5KB593.se.frodlund.claude-usage

  SnapshotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Sources/UsageCore
      - Sources/SharedViews
      - Sources/Widget/Views
      - Sources/MenuBarApp/Views
      # Settings renders live Poller state; App.swift stays out, its @main would
      # collide with the test bundle's entry point. The rest come along because
      # Poller or the settings panes reference them, not because anything renders
      # them: Notifier for the threshold alerts, MenuBarIcon for the drawn label,
      # Hotkey for the shortcut picker.
      - Sources/MenuBarApp/Poller.swift
      - Sources/MenuBarApp/Notifier.swift
      - Sources/MenuBarApp/MenuBarIcon.swift
      - Sources/MenuBarApp/Hotkey.swift
      - Tests/SnapshotTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.frodlund.claude-usage.snapshots
        # A logic test with no host app — ImageRenderer needs no running NSApp.
        CODE_SIGNING_ALLOWED: NO

schemes:

  ClaudeUsage:
    build:
      targets:
        ClaudeUsage: all
    run:
      config: Debug
    archive:
      config: Release

  SnapshotTests:
    build:
      targets:
        SnapshotTests: [test]
    test:
      config: Debug
      targets:
        - SnapshotTests
